<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes,viewport-fit=cover"/>
<title>Velo — Your Velontri Shopping Assistant</title>
<meta name="description" content="Chat with Velo to find anything on Velontri marketplace — phones, cars, furniture, property and more."/>
<meta name="theme-color" content="#4F46E5"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  /* ══════════════════════════════════════════════════════════════
     LIGHT MODE - Velontri Brand Colors
  ══════════════════════════════════════════════════════════════ */
  --primary: #4F46E5;        /* Velontri Indigo */
  --primary-light: #6366F1;  /* Light Indigo */
  --primary-dark: #4338CA;   /* Dark Indigo */
  --primary-glow: rgba(79, 70, 229, 0.15);
  --primary-soft: rgba(79, 70, 229, 0.08);
  
  --accent: #8B5CF6;         /* Purple accent */
  --accent-light: #A78BFA;
  --accent-glow: rgba(139, 92, 246, 0.15);
  
  --success: #4F46E5;        /* Blue for success states */
  --warning: #D97706;        /* Orange for warnings */
  --error: #EF4444;          /* Red for errors */
  --whatsapp: #25D366;       /* WhatsApp green */
  
  /* Neutral colors - Clean white background */
  --bg: #FFFFFF;             /* Pure white background */
  --bg-1: #FFFFFF;           /* Pure white */
  --bg-2: #F8F9FA;           /* Very light gray */
  --bg-3: #F1F3F5;           /* Light gray */
  --card: #FFFFFF;           /* Pure white cards */
  --input: #FFFFFF;          /* Pure white inputs */
  
  --border: #E9ECEF;         /* Very light border */
  --border-medium: #DEE2E6;  /* Light border */
  --border-dark: #ADB5BD;    /* Medium border */
  
  --text: #0a0a0a;           /* Almost black text */
  --text-secondary: #495057; /* Gray text */
  --text-tertiary: #868E96;  /* Light gray text */
  
  /* Shadows */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
  --shadow-xl: 0 20px 35px -10px rgba(0, 0, 0, 0.15);
  
  /* Radius */
  --radius: 12px;
  --radius-lg: 16px;
  --radius-sm: 8px;
  
  /* Font */
  --font: 'Inter', system-ui, -apple-system, sans-serif;
}

/* ══════════════════════════════════════════════════════════════
   DARK MODE - ONLY detects parent site (velontri.pxxl.click)
   Does NOT use system preference - controlled by .dark-mode class
══════════════════════════════════════════════════════════════ */

/* Dark mode class (set by JavaScript detection of parent site) */
.dark-mode {
  --primary: #6366F1;
  --primary-light: #818CF8;
  --primary-dark: #4F46E5;
  --primary-glow: rgba(99, 102, 241, 0.25);
  --primary-soft: rgba(99, 102, 241, 0.12);
  
  --accent: #A78BFA;
  --accent-light: #C4B5FD;
  --accent-glow: rgba(167, 139, 250, 0.2);
  
  --success: #6366F1;
  --warning: #F59E0B;
  --error: #F87171;
  --whatsapp: #25D366;
  
  --bg: #0a0a0a;
  --bg-1: #1a1a1a;
  --bg-2: #2a2a2a;
  --bg-3: #3a3a3a;
  --card: #1a1a1a;
  --input: #2a2a2a;
  
  --border: #2a2a2a;
  --border-medium: #3a3a3a;
  --border-dark: #4a4a4a;
  
  --text: #F8F9FA;
  --text-secondary: #ADB5BD;
  --text-tertiary: #6C757D;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
  --shadow-xl: 0 20px 35px -10px rgba(0, 0, 0, 0.7);
}

.dark-mode img:not(.logo) {
  opacity: 0.9;
}

.dark-mode #header {
  background: rgba(26, 26, 26, 0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.dark-mode .modal {
  background: rgba(10, 10, 10, 0.8);
}

*, *::before, *::after { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
}

html, body { 
  height: 100%; 
  overflow: hidden; 
}

body { 
  font-family: var(--font); 
  background: var(--bg);
  color: var(--text); 
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 14px; 
  line-height: 1.5;
  transition: background-color 0.3s ease, color 0.3s ease;
}

button { 
  cursor: pointer; 
  border: none; 
  background: none; 
  font: inherit; 
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  transition: all 0.2s ease;
}

a { 
  color: inherit; 
  text-decoration: none; 
  -webkit-tap-highlight-color: rgba(0,0,0,0); 
}

img { 
  display: block; 
  max-width: 100%; 
}

/* ══════════════════════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════════════════════ */
#app { display: flex; height: 100dvh; position: relative; }

/* Hamburger menu button - Beautifully responsive */
#hamburger {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 1000;
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius: 10px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid rgba(255, 255, 255, 0.1);
}
#hamburger:active {
  transform: scale(0.95);
}
#hamburger:hover { 
  background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
}
#hamburger span {
  width: 18px;
  height: 2px;
  background: white;
  border-radius: 2px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: block;
}
#hamburger.open {
  background: linear-gradient(135deg, var(--error) 0%, #dc2626 100%);
}
#hamburger.open span:nth-child(1) { 
  transform: rotate(45deg) translate(5px, 5px);
}
#hamburger.open span:nth-child(2) { 
  opacity: 0;
  transform: translateX(-10px);
}
#hamburger.open span:nth-child(3) { 
  transform: rotate(-45deg) translate(5px, -5px);
}

/* ── Sidebar ── */
#sidebar {
  width: 280px;
  background: var(--bg-1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: relative;
  transition: transform .3s ease, background-color 0.3s ease;
  z-index: 100;
}
#sidebar-head {
  padding: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#new-chat-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px; background: var(--primary); color: white; font-weight: 700; font-size: 13px;
  border-radius: var(--radius); transition: .2s;
}
#new-chat-btn:hover { background: var(--primary-light); transform: translateY(-1px); }
#sidebar-body { flex: 1; overflow-y: auto; padding: 12px; }
#convs { display: flex; flex-direction: column; gap: 6px; }
.conv-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  background: transparent; border-radius: var(--radius-sm); cursor: pointer;
  transition: .15s; color: var(--text-secondary); font-size: 13px; font-weight: 500;
  border: 1px solid transparent; position: relative;
}
.conv-item:hover { background: var(--card); color: var(--text); }
.conv-item.active { background: var(--primary-soft); border-color: rgba(37,99,235,.25); color: var(--primary-light); }
.conv-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conv-del {
  opacity: 0; transition: .15s; width: 20px; height: 20px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center; background: var(--error);
}
.conv-item:hover .conv-del { opacity: 1; }
#sidebar-foot {
  padding: 16px; border-top: 1px solid var(--border); flex-shrink: 0;
  display: flex; flex-direction: column; gap: 10px;
}
.sidebar-btn {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: var(--card); border-radius: var(--radius-sm); font-size: 12px; font-weight: 600;
  color: var(--text-secondary); transition: .15s; border: 1px solid transparent;
}
.sidebar-btn:hover { background: var(--bg-3); color: var(--text); border-color: var(--border-medium); }
.sidebar-btn svg { width: 16px; height: 16px; }

/* ── Main ── */
#main { flex: 1; display: flex; flex-direction: column; position: relative; }
#header {
  display: flex; align-items: center; gap: 12px; padding: 16px 24px;
  background: var(--deep-navy); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 10;
}
.logo { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; border: 1.5px solid var(--primary-glow); box-shadow: 0 0 16px var(--primary-glow); }
.hdr-info h1 { font-size: 15px; font-weight: 800; letter-spacing: -.3px; color: var(--white); }
.hdr-info p { font-size: 11px; color: rgba(255,255,255,.7); }
.hdr-pills { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.pill {
  display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; text-transform: uppercase;
  padding: 5px 10px; border-radius: 100px; letter-spacing: .5px;
}
.pill-live { background: rgba(79,70,229,.15); border: 1px solid rgba(79,70,229,.3); color: var(--primary); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: blink 2s ease infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

#messages {
  flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px;
  scroll-behavior: smooth;
}
.msg { display: flex; gap: 14px; animation: fadeIn .3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg-av {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;
  overflow: hidden;
}
.msg-av.user { background: var(--primary); color: white; }
.msg-av.assistant { 
  background: transparent;
  color: white;
  overflow: hidden;
  padding: 0;
}
.msg-av.assistant img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.msg-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.msg-body { flex: 1; min-width: 0; }
.msg-role { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.msg-text { 
  color: var(--text); 
  line-height: 1.6; 
  word-wrap: break-word; 
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--white);
}
.msg.user-msg .msg-text {
  background: var(--primary);
  color: #FFFFFF;
}
.msg-text strong { font-weight: 700; color: var(--primary-light); }
.msg-text a { color: var(--bl-l); text-decoration: underline; }
.msg-listings { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }

/* Listing card */
.lcard {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; transition: .2s; cursor: pointer;
}
.lcard:hover { border-color: var(--border-medium); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.cimg, .ciph {
  width: 100%; height: 180px; object-fit: cover; background: var(--bg-2);
  display: flex; align-items: center; justify-content: center; font-size: 42px;
}
.cbody { padding: 14px; }
.cbadges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.badge {
  font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  padding: 3px 7px; border-radius: 4px;
}
.bnew { background: rgba(34,197,94,.15); color: var(--green); border: 1px solid rgba(34,197,94,.3); }
.bused { background: rgba(59,130,246,.15); color: var(--bl-l); border: 1px solid rgba(59,130,246,.3); }
.brefurb { background: rgba(168,85,247,.15); color: #A855F7; border: 1px solid rgba(168,85,247,.3); }
.bneg { background: rgba(251,191,36,.15); color: #FBBF24; border: 1px solid rgba(251,191,36,.3); }
.bverif { background: var(--primary-glow); color: var(--primary-light); border: 1px solid rgba(37,99,235,.25); }
.ctitle { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.cprice { font-size: 16px; font-weight: 800; color: var(--primary-light); margin-bottom: 8px; }
.neg { font-size: 11px; font-weight: 600; color: var(--text-tertiary); }
.cloc {
  display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary);
  margin-bottom: 8px;
}
.cloc svg { width: 12px; height: 12px; }
.cseller {
  display: flex; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text-secondary);
}
.seller-av {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--primary-light), var(--bl-l));
  border: 1px solid var(--border-medium); display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: var(--text);
}
.vicon {
  width: 14px; height: 14px; background: var(--bl); border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.vicon svg { width: 8px; height: 8px; }
.sname { font-weight: 600; }
.cacts {
  display: flex; gap: 8px; padding: 10px 14px; background: rgba(0,0,0,.2);
  border-top: 1px solid var(--border);
}
.bview, .bwa {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 14px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700;
  transition: .15s;
}
.bview {
  background: var(--bg-3); color: var(--text); border: 1px solid var(--border-medium);
}
.bview:hover { background: var(--card); }
.bwa {
  background: var(--whatsapp); color: white; border: 1px solid rgba(255,255,255,.15);
}
.bwa:hover { background: #1FC759; }
.bwa svg { width: 14px; height: 14px; }

/* Empty state */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 60px 24px; color: var(--text-secondary);
}
.empty-icon { font-size: 64px; margin-bottom: 16px; opacity: .6; }
.empty h2 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
.empty p { font-size: 14px; max-width: 400px; }
.suggestions {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px;
}
.sug-btn {
  padding: 10px 16px; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; font-weight: 600; color: var(--text-secondary);
  transition: .15s;
}
.sug-btn:hover { background: var(--bg-3); border-color: var(--border-medium); color: var(--text); }

/* Typing indicator */
.typing {
  display: flex; align-items: center; gap: 6px; padding: 12px 16px;
  background: var(--card); border-radius: var(--radius); width: fit-content;
}
.typing span {
  width: 8px; height: 8px; border-radius: 50%; background: var(--text-tertiary);
  animation: bounce .6s ease infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* Input area */
#input-area {
  padding: 20px 24px; background: var(--bg-1); border-top: 1px solid var(--border); flex-shrink: 0;
}
#input-form { display: flex; gap: 10px; }
#input {
  flex: 1; padding: 14px 18px; background: var(--input); border: 1px solid var(--border);
  border-radius: var(--radius-lg); color: var(--text); font-size: 14px; resize: none;
  font-family: var(--font); line-height: 1.4; max-height: 120px; transition: .15s;
}
#input:focus { outline: none; border-color: var(--primary); background: var(--card); }
#input::placeholder { color: var(--text-tertiary); }
#send-btn {
  width: 48px; height: 48px; background: var(--primary); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: .2s; flex-shrink: 0;
}
#send-btn:hover:not(:disabled) { background: var(--primary-light); transform: scale(1.05); }
#send-btn:disabled { opacity: .5; cursor: not-allowed; }
#send-btn svg { width: 20px; height: 20px; }

/* Modal */
.modal {
  position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,.75); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: 24px; animation: fadeIn .2s ease;
}
.modal.open { display: flex; }
.modal-content {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-lg);
  max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto;
  padding: 24px; animation: slideUp .3s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.modal-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
}
.modal-head h2 { font-size: 18px; font-weight: 800; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%; background: var(--card);
  display: flex; align-items: center; justify-content: center; transition: .15s;
}
.modal-close:hover { background: var(--error); }
.modal-body { display: flex; flex-direction: column; gap: 12px; }
.memory-item {
  display: flex; align-items: start; gap: 10px; padding: 12px; background: var(--card);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.memory-icon {
  width: 32px; height: 32px; border-radius: 8px; background: var(--primary-glow);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.memory-icon svg { width: 16px; height: 16px; color: var(--primary-light); }
.memory-text { flex: 1; }
.memory-type { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-tertiary); margin-bottom: 4px; }
.memory-content { font-size: 13px; color: var(--text-secondary); }
.memory-del {
  width: 28px; height: 28px; border-radius: 6px; background: transparent;
  display: flex; align-items: center; justify-content: center; transition: .15s; flex-shrink: 0;
}
.memory-del:hover { background: var(--error); }
.modal-actions {
  display: flex; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
}
.modal-btn {
  flex: 1; padding: 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700;
  transition: .15s;
}
.modal-btn-danger {
  background: rgba(239,68,68,.15); color: var(--error); border: 1px solid rgba(239,68,68,.3);
}
.modal-btn-danger:hover { background: var(--error); color: white; }

/* ══════════════════════════════════════════════════════════════
   MOBILE RESPONSIVE DESIGN
   Optimized for all mobile devices including small screens
══════════════════════════════════════════════════════════════ */

/* Desktop: Ensure sidebar is always visible */
@media (min-width: 769px) {
  #sidebar {
    display: flex !important;
    position: relative !important;
    transform: translateX(0) !important;
  }
  
  #sidebar-overlay {
    display: none !important;
  }
  
  #hamburger {
    display: none !important;
  }
}

@media (max-width: 768px) {
  /* Show hamburger menu */
  #hamburger { 
    display: flex;
    -webkit-tap-highlight-color: transparent;
    top: 10px;
    left: 10px;
    width: 38px;
    height: 38px;
  }
  
  /* Sidebar - slide in from left */
  #sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 999;
    transform: translateX(-100%);
    box-shadow: 4px 0 24px rgba(0,0,0,.5);
    width: 85vw;
    max-width: 320px;
  }
  #sidebar.open { transform: translateX(0); }
  
  /* Dark overlay when sidebar is open */
  #sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 998;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  #sidebar-overlay.show { display: block; }
  
  /* Header - compact for mobile */
  #header { 
    padding: 10px 12px 10px 60px;
    min-height: 60px;
  }
  
  /* Logo - smaller on mobile */
  .logo {
    width: 32px;
    height: 32px;
  }
  
  /* Header text - smaller */
  .hdr-info h1 { font-size: 13px; }

  /* Messages area - safe area for notched devices */

  }
  
  /* Message cards - better spacing */

  .msg-role { font-size: 10px; }
  .msg-text { font-size: 14px; padding: 10px 14px; }
  
  /* Listings grid - single column */
  .msg-listings { 
    grid-template-columns: 1fr;
    gap: 12px;
  }
  
  /* Listing cards - full width, touch-friendly */
  .lcard { 
    max-width: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  .cimg, .ciph { height: 200px; }
  .cbody { padding: 12px; }
  .ctitle { font-size: 13px; }
  .cprice { font-size: 15px; }

  }
  
  /* Send button - touch-friendly size */

  /* Modal - full screen on mobile */

    max-width: 100%;

    max-height: 100vh;
    height: 100vh;
    border-radius: 0;

  /* Sidebar buttons - better touch targets */

  .sidebar-btn { padding: 12px; font-size: 13px; }

}

/* Extra small devices (320px - 375px) */
@media (max-width: 375px) {
  #hamburger {
    top: 8px;
    left: 8px;
    width: 36px;
    height: 36px;
  }
  #hamburger span {
    width: 16px;
  }
  #header { padding: 8px 10px 8px 56px; }
  .logo { width: 28px; height: 28px; }
  .hdr-info h1 { font-size: 12px; }
  .hdr-info p { font-size: 8px; }
  
  #messages { padding: 68px 10px 10px; }
  .msg { gap: 8px; }
  .msg-av { width: 28px; height: 28px; font-size: 12px; }

  #input-area { padding: 8px 10px; }

/* Landscape mode - optimize vertical space */
@media (max-width: 768px) and (orientation: landscape) {

  .empty-icon { font-size: 40px; }

}

/* Touch device optimizations */
@media (hover: none) and (pointer: coarse) {
  /* Remove hover effects on touch devices */
  button:hover { transform: none !important; }
  
  /* Add active states for better touch feedback */
  button:active { 
    transform: scale(0.95);
    opacity: 0.8;
  }
  
  .lcard:active { transform: translateY(0) scale(0.98); }
  .conv-item:active { background: var(--primary-glow); }

}
</style>
</head>
<body>
<!-- Hamburger Menu (Mobile) -->
<button id="hamburger" aria-label="Toggle menu">

  <aside id="sidebar">

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let SESSION_ID = localStorage.getItem('velo_session_id') || crypto.randomUUID();
localStorage.setItem('velo_session_id', SESSION_ID);

let CURRENT_CONV_ID = null;
let CONVERSATIONS = [];
let MESSAGES = [];
const API = 'https://velontri-chatbot-backend.onrender.com/api/chat';

// ═══════════════════════════════════════════════════════════
// DARK MODE DETECTION FROM PARENT SITE
// IMPORTANT: Only detects parent site, NOT system preference
// ═══════════════════════════════════════════════════════════
function detectParentDarkMode() {
  console.log('[Velo Dark Mode] Starting dark mode detection...');
  console.log('[Velo Dark Mode] ⚠️ System preference will be IGNORED');
  console.log('[Velo Dark Mode] ✅ Only detecting velontri.pxxl.click theme');
  
  // Force light mode initially (remove any system-based dark mode)
  document.documentElement.classList.remove('dark-mode');
  console.log('[Velo Dark Mode] ✅ Initialized to LIGHT mode (default)');
  
  try {
    // Check if we're in an iframe
    const isIframe = window.self !== window.top;
    console.log('[Velo Dark Mode] Running in iframe:', isIframe);
    
    if (!isIframe) {
      console.log('[Velo Dark Mode] ⚠️ Not in iframe, staying in LIGHT mode');
      console.log('[Velo Dark Mode] (Will only use dark mode when embedded in velontri.pxxl.click)');
      return;
    }
    
    // Try to access parent document (same-origin only)
    try {
      const parentDoc = window.parent.document;
      const parentHtml = parentDoc.documentElement;
      const parentBody = parentDoc.body;
      
      console.log('[Velo Dark Mode] ✅ Successfully accessed parent document (same-origin)');
      console.log('[Velo Dark Mode] Parent HTML classes:', parentHtml.className);
      console.log('[Velo Dark Mode] Parent HTML data-theme:', parentHtml.getAttribute('data-theme'));
      console.log('[Velo Dark Mode] Parent BODY classes:', parentBody.className);
      console.log('[Velo Dark Mode] Parent BODY data-theme:', parentBody.getAttribute('data-theme'));
      
      // Function to check dark mode state
      function checkDarkMode() {
        const isDark = 
          parentHtml.classList.contains('dark') ||
          parentHtml.classList.contains('dark-mode') ||
          parentHtml.getAttribute('data-theme') === 'dark' ||
          parentBody.classList.contains('dark') ||
          parentBody.classList.contains('dark-mode') ||
          parentBody.getAttribute('data-theme') === 'dark';
        
        console.log('[Velo Dark Mode] Parent site dark mode status:', isDark);
        return isDark;
      }
      
      // Initial check and apply
      const initialDark = checkDarkMode();
      if (initialDark) {
        document.documentElement.classList.add('dark-mode');
        console.log('[Velo Dark Mode] ✅ Applied DARK mode (parent is dark)');
      } else {
        document.documentElement.classList.remove('dark-mode');
        console.log('[Velo Dark Mode] ✅ Keeping LIGHT mode (parent is light)');
      }
      
      // Watch for changes in parent
      const observer = new MutationObserver((mutations) => {
        console.log('[Velo Dark Mode] 🔄 Parent site theme changed!');
        mutations.forEach(mutation => {
          console.log('[Velo Dark Mode] Changed:', mutation.type, mutation.attributeName, mutation.target.nodeName);
          if (mutation.oldValue !== mutation.target.getAttribute(mutation.attributeName)) {
            console.log('[Velo Dark Mode]   Old:', mutation.oldValue);
            console.log('[Velo Dark Mode]   New:', mutation.target.getAttribute(mutation.attributeName));
          }
        });
        
        const nowDark = checkDarkMode();
        
        if (nowDark) {
          document.documentElement.classList.add('dark-mode');
          console.log('[Velo Dark Mode] ✅ Switched to DARK mode');
        } else {
          document.documentElement.classList.remove('dark-mode');
          console.log('[Velo Dark Mode] ✅ Switched to LIGHT mode');
        }
      });
      
      // Observe both html and body for class/attribute changes
      observer.observe(parentHtml, { 
        attributes: true, 
        attributeFilter: ['class', 'data-theme', 'style'],
        attributeOldValue: true
      });
      observer.observe(parentBody, { 
        attributes: true, 
        attributeFilter: ['class', 'data-theme', 'style'],
        attributeOldValue: true
      });
      
      console.log('[Velo Dark Mode] ✅ MutationObserver attached and monitoring parent');
      
    } catch (e) {
      // Cross-origin iframe - use postMessage communication
      console.warn('[Velo Dark Mode] ⚠️ Cross-origin iframe detected:', e.message);
      console.log('[Velo Dark Mode] Listening for postMessage from parent...');
      console.log('[Velo Dark Mode] Parent site needs to send {type: "darkModeChange", isDark: boolean}');
      
      // Listen for messages from parent about dark mode
      window.addEventListener('message', (event) => {
        console.log('[Velo Dark Mode] 📨 Received message:', event.data);
        
        if (event.data && event.data.type === 'darkModeChange') {
          console.log('[Velo Dark Mode] Dark mode message received, isDark:', event.data.isDark);
          
          if (event.data.isDark) {
            document.documentElement.classList.add('dark-mode');
            console.log('[Velo Dark Mode] ✅ Applied DARK mode via postMessage');
          } else {
            document.documentElement.classList.remove('dark-mode');
            console.log('[Velo Dark Mode] ✅ Applied LIGHT mode via postMessage');
          }
        }
      });
      
      // Request initial state from parent
      try {
        window.parent.postMessage({ type: 'requestDarkMode' }, '*');
        console.log('[Velo Dark Mode] 📤 Sent requestDarkMode to parent');
      } catch (postErr) {
        console.error('[Velo Dark Mode] Could not send message to parent:', postErr);
      }
    }
  } catch (e) {
    console.error('[Velo Dark Mode] ❌ Error in dark mode detection:', e);
  }
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════

// Run dark mode detection IMMEDIATELY (before DOM loads)
// This ensures we start in the correct mode
detectParentDarkMode();

window.addEventListener('DOMContentLoaded', () => {
  console.log('[Velo] ========================================');
  console.log('[Velo] Chatbot initializing...');
  console.log('[Velo] Current HTML classes:', document.documentElement.className);
  console.log('[Velo] Window location:', window.location.href);
  console.log('[Velo] ========================================');
  
  // Detect parent site dark mode again (in case it changed)
  detectParentDarkMode();
  
  // Log current state after detection
  setTimeout(() => {
    console.log('[Velo] ========================================');
    console.log('[Velo] Post-detection state:');
    console.log('[Velo] HTML has dark-mode class:', document.documentElement.classList.contains('dark-mode'));
    console.log('[Velo] Computed background color:', getComputedStyle(document.body).backgroundColor);
    console.log('[Velo] ========================================');
  }, 500);
  
  loadConversations();
  showEmpty();
  
  document.getElementById('input-form').addEventListener('submit', sendMessage);
  document.getElementById('new-chat-btn').addEventListener('click', newChat);
  document.getElementById('memories-btn').addEventListener('click', openMemoriesModal);
  
  // Hamburger menu (mobile)
  const hamburger = document.getElementById('hamburger');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  
  overlay.addEventListener('click', () => {
    hamburger.classList.remove('open');
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });
  
  // Auto-resize textarea
  const input = document.getElementById('input');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
  
  // Enter key to send (Shift+Enter for new line)
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('input-form').dispatchEvent(new Event('submit'));
    }
  });
});

// ═══════════════════════════════════════════════════════════
// CONVERSATIONS
// ═══════════════════════════════════════════════════════════
async function loadConversations() {
  try {
    const res = await fetch(`${API}/conversations?session_id=${SESSION_ID}`);
    const data = await res.json();
    CONVERSATIONS = data.conversations || [];
    renderConversations();
  } catch (err) {
    console.error('Load convs:', err);
  }
}

function renderConversations() {
  const html = CONVERSATIONS.map(c => 
    `<div class="conv-item ${c.id === CURRENT_CONV_ID ? 'active' : ''}" onclick="loadConversation('${c.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
      <span class="conv-title">${esc(c.title || 'New conversation')}</span>
      <button class="conv-del" onclick="event.stopPropagation(); deleteConversation('${c.id}')">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" width="12" height="12">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
        </svg>
      </button>
    </div>`
  ).join('');
  document.getElementById('convs').innerHTML = html || '<p style="text-align:center;color:var(--text-tertiary);font-size:12px;padding:20px 0;">No conversations yet</p>';
}

async function loadConversation(convId) {
  try {
    const res = await fetch(`${API}/conversations/${convId}/messages?session_id=${SESSION_ID}`);
    const data = await res.json();
    MESSAGES = data.messages || [];
    CURRENT_CONV_ID = convId;
    renderMessages();
    renderConversations();
    
    // Close mobile sidebar
    document.getElementById('hamburger').classList.remove('open');
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
  } catch (err) {
    console.error('Load conv:', err);
  }
}

async function deleteConversation(convId) {
  if (!confirm('Delete this conversation?')) return;
  try {
    await fetch(`${API}/conversations/${convId}?session_id=${SESSION_ID}`, { method: 'DELETE' });
    if (CURRENT_CONV_ID === convId) {
      CURRENT_CONV_ID = null;
      MESSAGES = [];
      showEmpty();
    }
    loadConversations();
  } catch (err) {
    console.error('Delete conv:', err);
  }
}

function newChat() {
  CURRENT_CONV_ID = null;
  MESSAGES = [];
  showEmpty();
  renderConversations();
  document.getElementById('input').focus();
  
  // Close mobile sidebar
  document.getElementById('hamburger').classList.remove('open');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════
// MESSAGES
// ═══════════════════════════════════════════════════════════
function showEmpty() {
  document.getElementById('messages').innerHTML = `
    <div class="empty">
      <div class="empty-icon">🛍️</div>
      <h2>Hey! I'm Velo</h2>
      <p>Your friendly Velontri shopping assistant. Tell me what you're looking for and I'll find it.</p>
      <div class="suggestions">
        <button class="sug-btn" onclick="quickSearch('Samsung phone under ₦200k')">Samsung under ₦200k</button>
        <button class="sug-btn" onclick="quickSearch('Toyota Corolla in Lagos')">Toyota Corolla in Lagos</button>
        <button class="sug-btn" onclick="quickSearch('Gaming laptop')">Gaming laptop</button>
        <button class="sug-btn" onclick="quickSearch('3-bedroom flat in Abuja')">Flat in Abuja</button>
      </div>
    </div>
  `;
}

function renderMessages() {
  const $msgs = document.getElementById('messages');
  const html = MESSAGES
    .filter(m => m.role === 'user' || m.role === 'assistant')
    .map(renderMessage)
    .join('');
  $msgs.innerHTML = html || '';
  $msgs.scrollTop = $msgs.scrollHeight;
}

function renderMessage(msg) {
  const isUser = msg.role === 'user';
  const veloLogo = `<img src="assets/velontri-logo.png" alt="Velo" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%2316845B%22/%3E%3Ctext x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22 font-size=%2248%22 font-weight=%22bold%22%3EV%3C/text%3E%3C/svg%3E'"/>`;
  const av = isUser
    ? `<div class="msg-av user">Y</div>`
    : `<div class="msg-av assistant">${veloLogo}</div>`;
  
  return `
    <div class="msg ${isUser ? 'user-msg' : ''}">
      ${av}
      <div class="msg-body">
        <div class="msg-role">${isUser ? 'You' : 'Velo'}</div>
        <div class="msg-text">${formatText(msg.content)}</div>
      </div>
    </div>
  `;
}

function appendMessage(role, content, listings = []) {
  MESSAGES.push({ role, content, created_at: Date.now() });
  
  const $msgs = document.getElementById('messages');
  const isUser = role === 'user';
  const veloLogo = `<img src="assets/velontri-logo.png" alt="Velo" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%2316845B%22/%3E%3Ctext x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22 font-size=%2248%22 font-weight=%22bold%22%3EV%3C/text%3E%3C/svg%3E'"/>`;
  const av = isUser
    ? `<div class="msg-av user">Y</div>`
    : `<div class="msg-av assistant">${veloLogo}</div>`;
  
  const listingsHTML = listings.length > 0
    ? `<div class="msg-listings">${listings.map(renderListing).join('')}</div>`
    : '';
  
  const html = `
    <div class="msg ${isUser ? 'user-msg' : ''}">
      ${av}
      <div class="msg-body">
        <div class="msg-role">${isUser ? 'You' : 'Velo'}</div>
        <div class="msg-text">${formatText(content)}</div>
        ${listingsHTML}
      </div>
    </div>
  `;
  $msgs.insertAdjacentHTML('beforeend', html);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function showTyping() {
  const $msgs = document.getElementById('messages');
  const veloLogo = `<img src="assets/velontri-logo.png" alt="Velo" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%2316845B%22/%3E%3Ctext x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22white%22 font-size=%2248%22 font-weight=%22bold%22%3EV%3C/text%3E%3C/svg%3E'"/>`;
  const html = `
    <div class="msg" id="typing-msg">
      <div class="msg-av assistant">${veloLogo}</div>
      <div class="msg-body">
        <div class="msg-role">Velo</div>
        <div class="typing"><span></span><span></span><span></span></div>
      </div>
    </div>
  `;
  $msgs.insertAdjacentHTML('beforeend', html);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function removeTyping() {
  document.getElementById('typing-msg')?.remove();
}

// ═══════════════════════════════════════════════════════════
// SEND MESSAGE - Optimized with retry and timeout handling
// ═══════════════════════════════════════════════════════════
async function sendMessage(e) {
  e.preventDefault();
  const $input = document.getElementById('input');
  const message = $input.value.trim();
  if (!message) return;

  $input.value = '';
  $input.style.height = 'auto';
  $input.disabled = true;

  // Show user message
  appendMessage('user', message);

  // Show typing
  showTyping();

  // Retry logic
  let attempts = 0;
  const maxAttempts = 3;
  
  while (attempts < maxAttempts) {
    attempts++;
    
    try {
      // Create abort controller for timeout
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s timeout
      
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          session_id: SESSION_ID,
          conversation_id: CURRENT_CONV_ID,
        }),
        signal: controller.signal,
      });

      clearTimeout(timeoutId);

      const data = await res.json();
      removeTyping();

      if (data.error) {
        // Check if it's a timeout error
        if (data.timeout && attempts < maxAttempts) {
          console.log(`Attempt ${attempts} timed out, retrying...`);
          showTyping();
          await new Promise(resolve => setTimeout(resolve, 1000)); // Wait 1s before retry
          continue;
        }
        appendMessage('assistant', `⚠️ ${data.error}`);
        break;
      } else {
        CURRENT_CONV_ID = data.conversation_id;
        appendMessage('assistant', data.text, data.listings || []);
        loadConversations();
        break;
      }
    } catch (err) {
      console.error('Send error:', err);
      removeTyping();
      
      // Handle different error types
      if (err.name === 'AbortError') {
        if (attempts < maxAttempts) {
          console.log(`Request timed out, attempt ${attempts}/${maxAttempts}, retrying...`);
          showTyping();
          await new Promise(resolve => setTimeout(resolve, 1000));
          continue;
        } else {
          appendMessage('assistant', `⚠️ The request is taking longer than expected. The response will arrive shortly, or please try asking in a simpler way.`);
        }
      } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
        appendMessage('assistant', '⚠️ Connection issue. Please check your internet and try again.');
      } else {
        if (attempts < maxAttempts) {
          showTyping();
          await new Promise(resolve => setTimeout(resolve, 1000));
          continue;
        }
        appendMessage('assistant', '⚠️ Something went wrong. Please try again.');
      }
      break;
    }
  }
  
  $input.disabled = false;
  $input.focus();
}

function quickSearch(query) {
  document.getElementById('input').value = query;
  document.getElementById('input-form').dispatchEvent(new Event('submit'));
}

function navigateToListing(url) {
  console.log('[Velo Nav] Navigating to:', url);
  
  try {
    // Check if we're in an iframe
    const isIframe = window.self !== window.top;
    
    if (isIframe) {
      // Try to navigate parent window (same-origin)
      try {
        window.top.location.href = url;
        console.log('[Velo Nav] ✅ Navigated parent window');
        return;
      } catch (e) {
        // Cross-origin - use postMessage to ask parent to navigate
        console.log('[Velo Nav] Cross-origin detected, using postMessage');
        window.parent.postMessage({
          type: 'navigate',
          url: url
        }, '*');
        
        // Fallback: open in new tab after short delay if parent doesn't respond
        setTimeout(() => {
          console.log('[Velo Nav] ⚠️ Fallback: Opening in new tab');
          window.open(url, '_blank');
        }, 500);
      }
    } else {
      // Standalone - just navigate normally
      window.location.href = url;
      console.log('[Velo Nav] ✅ Navigated standalone window');
    }
  } catch (err) {
    console.error('[Velo Nav] ❌ Navigation error:', err);
    // Final fallback
    window.open(url, '_blank');
  }
}

async function openMemoriesModal() {
  try {
    const res = await fetch(`${API}/memories?session_id=${SESSION_ID}`);
    const data = await res.json();
    const memories = data.memories || [];
    
    const html = memories.length === 0
      ? '<p style="text-align:center;color:var(--text-tertiary);padding:40px 0;">No memories saved yet.<br>Velo will remember important preferences as you chat.</p>'
      : memories.map(m => `
        <div class="memory-item">
          <div class="memory-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="memory-text">
            <div class="memory-type">${esc(m.memory_type.replace(/_/g, ' '))}</div>
            <div class="memory-content">${esc(m.content)}</div>
          </div>
          <button class="memory-del" onclick="deleteMemory('${m.id}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" width="14" height="14">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>
      `).join('');
    
    document.getElementById('memories-list').innerHTML = html;
    document.getElementById('memories-modal').classList.add('open');
  } catch (err) {
    console.error('Load memories:', err);
    alert('Could not load memories. Try again.');
  }
}

function closeMemoriesModal() {
  document.getElementById('memories-modal').classList.remove('open');
}

async function deleteMemory(memId) {
  try {
    await fetch(`${API}/memories/${memId}?session_id=${SESSION_ID}`, { method: 'DELETE' });
    openMemoriesModal(); // Refresh
  } catch (err) {
    console.error('Delete memory:', err);
  }
}

async function clearAllMemories() {
  if (!confirm('Delete all memories? This cannot be undone.')) return;
  try {
    await fetch(`${API}/memories/clear`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID }),
    });
    openMemoriesModal(); // Refresh
  } catch (err) {
    console.error('Clear memories:', err);
  }
}

function esc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function formatText(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}
